<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">MODUS FLOW — Король принимает посла</title>
<desc id="desc">Зацикленная анимация королевской аудиенции из текущего SVG-прототипа: безликий посол входит в зал, король приветствует его; внизу показано подтверждение получения обращения. Это художественная визуализация, не запись геймплея.</desc>
